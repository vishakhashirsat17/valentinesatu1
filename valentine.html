<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4, #ffd1dc);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.35), transparent 60%);
      animation: pulse 6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%,100% { opacity: .4; }
      50% { opacity: .8; }
    }

    .card {
      position: relative;
      background: rgba(255,255,255,0.92);
      padding: 3rem 4rem 2.5rem;
      border-radius: 2.5rem;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      animation: floatIn 1.2s ease forwards;
      max-width: 90vw;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 1.5rem;
      color: #d72638;
    }

    .name-input {
      margin-bottom: 1.5rem;
    }

    .name-input input {
      border-radius: 999px;
      border: 1px solid #f3b5c1;
      padding: .7rem 1.4rem;
      font-size: 1rem;
      outline: none;
      width: 220px;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 2rem;
      justify-content: center;
      position: relative;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      touch-action: manipulation;
    }

    button:hover { transform: scale(1.1); filter: brightness(1.1); }

    .yes {
      background: linear-gradient(135deg,#ff4b7d,#ff7a9e);
      color: white;
    }

    .no {
      background: #eee;
      color: #444;
      position: relative;
    }

    .music-toggle {
      margin-top: 1.5rem;
      font-size: .9rem;
      background: transparent;
      box-shadow: none;
      color: #b11226;
    }

    .message {
      margin-top: 2rem;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      color: #b11226;
      display: none;
      animation: pop 0.8s ease forwards;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(40px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -40px;
      width: 24px;
      height: 24px;
      background: red;
      transform: rotate(45deg);
      animation: floatUp linear forwards;
      opacity: .8;
      pointer-events: none;
    }

    .heart:before,
    .heart:after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: red;
      border-radius: 50%;
    }

    .heart:before { top: -12px; left: 0; }
    .heart:after { left: -12px; top: 0; }

    @keyframes floatUp {
      to { transform: translateY(-110vh) rotate(45deg); opacity: 0; }
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <canvas id="fireworks"></canvas>

  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>

    <div class="name-input">
      <input id="name" placeholder="Your name (optional)" />
    </div>

    <div class="buttons">
      <button class="yes">Yes ❤️</button>
      <button class="no">No 💔</button>
    </div>

    <div class="message"></div>

    <button class="music-toggle">🎵 Music: Off</button>
  </div>

  <script>
    const noBtn = document.querySelector('.no');
    const yesBtn = document.querySelector('.yes');
    const message = document.querySelector('.message');
    const card = document.querySelector('.card');
    const nameInput = document.getElementById('name');
    const musicBtn = document.querySelector('.music-toggle');

    // --- Dodge button (mouse + touch, stays in viewport) ---
    function dodge() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseenter', dodge);
    noBtn.addEventListener('click', dodge);
    noBtn.addEventListener('touchstart', dodge);

    // --- Yes button ---
    yesBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      message.textContent = name
        ? `🎉 Congratulations, ${name}! You are officially my Valentine ❤️ 🎉`
        : '🎉 Congratulations! You are officially my Valentine ❤️ 🎉';

      message.style.display = 'block';
      card.querySelector('.buttons').style.display = 'none';
      nameInput.disabled = true;

      launchFireworks();
      startHearts();
    });

    // --- Floating hearts ---
    function startHearts() {
      const interval = setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart';
        const size = Math.random() * 20 + 16;
        heart.style.width = heart.style.height = size + 'px';
        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.background = `hsl(${Math.random()*360},80%,70%)`;
        heart.style.animationDuration = Math.random() * 3 + 4 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 8000);
      }, 400);

      setTimeout(() => clearInterval(interval), 15000);
    }

    // --- Music toggle using Web Audio API ---
    let audioCtx;
    let osc;
    let playing = false;

    musicBtn.addEventListener('click', () => {
      if (!playing) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 220;
        gain.gain.value = 0.04;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        playing = true;
        musicBtn.textContent = '🎵 Music: On';
      } else {
        osc.stop();
        audioCtx.close();
        playing = false;
        musicBtn.textContent = '🎵 Music: Off';
      }
    });

    // --- Fireworks ---
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function launchFireworks() {
      for (let i = 0; i < 6; i++) setTimeout(spawnBurst, i * 500);
      requestAnimationFrame(update);
    }

    function spawnBurst() {
      const cx = Math.random() * canvas.width;
      const cy = Math.random() * canvas.height * 0.5;
      for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 3;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 100,
          color: `hsl(${Math.random() * 360},90%,60%)`
        });
      }
    }

    function update() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => {
        p.vy += 0.05;
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length) requestAnimationFrame(update);
    }
  </script>
</body>
</html>
